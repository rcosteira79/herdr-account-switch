id = "rcosteira.account-switch"
name = "Account Switch"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Hot-swap Claude Code / Codex logins without re-authenticating. Overlay picker, cycle-to-next keybinding, and a per-pane account badge ($acct)."
platforms = ["macos", "linux"]

# Re-stamp the $acct badges after a server restart / live handoff. Badges are
# display-only, so a missed stamp costs nothing but a stale-looking sidebar.
[[startup]]
command = ["python3", "switcher.py", "stamp"]

# Add $acct to the sidebar rows, so the badge is actually rendered. Backs the
# config up first and reloads the server. Startup only warns; this one writes.
[[actions]]
id = "enable-badge"
title = "Accounts: add the $acct badge to the sidebar"
contexts = ["global"]
command = ["python3", "switcher.py", "enable-badge"]

# The reverse: take $acct out of the rows and clear it off the panes. For when
# you would rather show the account once in the tab bar than on every row.
[[actions]]
id = "disable-badge"
title = "Accounts: remove the $acct badge from the sidebar"
contexts = ["global"]
command = ["python3", "switcher.py", "disable-badge"]

# The picker (save / switch / rename / delete). `global` context: it is not
# about any one pane, the credentials it swaps are machine-wide per agent kind.
[[actions]]
id = "open"
title = "Accounts: open picker"
contexts = ["global"]
command = ["python3", "switcher.py", "open"]

# Cycle to the next profile of the focused agent's kind — the "on the go" path,
# no UI. `pane` context so it can read the focused agent to pick the kind.
[[actions]]
id = "next"
title = "Accounts: switch to next account"
contexts = ["global", "pane"]
command = ["python3", "switcher.py", "next"]

# Snapshot whatever is logged in right now into a new profile.
[[actions]]
id = "save"
title = "Accounts: save current login as a profile"
contexts = ["global"]
command = ["python3", "switcher.py", "save"]

[[actions]]
id = "status"
title = "Accounts: status"
contexts = ["global"]
command = ["python3", "switcher.py", "status"]

# What is left on every saved account, both agent kinds, in one panel.
[[actions]]
id = "usage"
title = "Accounts: open usage"
contexts = ["global"]
command = ["python3", "switcher.py", "open-usage"]

[[panes]]
id = "picker"
title = "Accounts"
command = ["python3", "switcher.py", "ui"]
placement = "overlay"

[[panes]]
id = "usage"
title = "Usage"
command = ["python3", "switcher.py", "usage-ui"]
placement = "overlay"
